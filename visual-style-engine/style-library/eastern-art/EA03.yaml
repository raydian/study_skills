  color: [矿物色雅致, 层层渲染]
  shading: [分染层次, 细腻过渡]
  lighting: [无真实光, 设色明暗]
  texture: [绢/熟宣, 细腻]
  composition: [典雅构图, 传统章法]
  detail: [8/10 精细]
