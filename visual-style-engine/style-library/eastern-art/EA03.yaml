# EA03 — Gongbi / 工笔
id: EA03
version: 1.0.0
status: ACTIVE
name: {zh: 工笔, en: Gongbi}
category: {id: eastern-art, name_zh: 东方艺术, name_en: Eastern Art}
parent_style: EASTERN_BASE
aliases: [gongbi painting, 工笔画, 工笔重彩]
definition:
  summary: >-
    精细线描 + 矿物色渲染的中国传统工笔画风：线条严谨流畅、敷色工整、绢纸质感典雅。
  detailed: >-
    工笔画以"工"著称：细匀有力的白描线稿、层层分染的矿物/植物色、绢本或熟宣上的细腻过渡。
    造型严谨、设色雅致，常见花鸟、仕女、器物题材。适用于传统文化、古典美学、高端东方品牌。
visual_intent: [refined, classical, oriental]
