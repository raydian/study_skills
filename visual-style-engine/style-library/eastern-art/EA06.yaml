# EA06 — Song Dynasty Aesthetic / 宋代美学
id: EA06
version: 1.0.0
status: ACTIVE
name: {zh: 宋代美学, en: Song Dynasty Aesthetic}
category: {id: eastern-art, name_zh: 东方艺术, name_en: Eastern Art}
parent_style: EASTERN_BASE
aliases: [song aesthetic, 宋韵, 极简东方]
definition:
  summary: >-
    以宋代审美为核心的东方极简：素雅、留白、含蓄、克制，一器一物皆有"格物"之美。
  detailed: >-
    宋代美学是东方审美的巅峰范式：色彩素雅（天青、月白、墨色）、造型简洁内敛、大量留白、
    含蓄克制的气质。器物如汝窑天青釉，画面如宋画山水的烟岚留白。适用于传统文化、茶道香道、
    高端东方品牌、禅意空间。
visual_intent: [quiet, refined, oriental]
