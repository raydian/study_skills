# EA10 — Neo-Chinese / 新中式
id: EA10
version: 1.0.0
status: ACTIVE
name: {zh: 新中式, en: Neo-Chinese}
category: {id: eastern-art, name_zh: 东方艺术, name_en: Eastern Art}
parent_style: EASTERN_BASE
aliases: [new chinese style, 新中式风格, 东方现代]
definition:
  summary: >-
    东方传统元素 + 现代设计语言的新中式风格：传统意象以当代简洁形式呈现，典雅又现代。
  detailed: >-
    新中式将东方元素（山水、窗棂、器物、书法、纹样）用现代设计语言重构：构图更现代、
    色彩更克制、留白更当代，介于传统与极简之间。适用于现代东方品牌、空间视觉、高端消费品、
    文化内容。
visual_intent: [modern, oriental, elegant]
fingerprint:
  shape: [传统意象现代重构, 简洁形]
  line: [干净现代线, 传统符号]
  color: [东方素色 + 局部墨色朱砂, 克制]
  shading: [简化层次]
  lighting: [现代氛围]
  texture: [纸/木/绢质感可选]
  composition: [现代留白, 传统符号焦点]
  detail: [3/10 简洁]
