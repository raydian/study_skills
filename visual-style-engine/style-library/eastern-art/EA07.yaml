aliases: [dunhuang art, 敦煌壁画, 敦煌风]
definition:
  summary: >-
    以敦煌壁画矿物色为特征的东方风格：土红石青石绿金色、飞天意象、壁画斑驳质感，瑰丽古拙。
  detailed: >-
    敦煌壁画风格以矿物颜料的高饱和与斑驳质感著称：土红、石青、石绿、金构成标志性色系；
    飞天、藻井、经变画等题材充满流动线条与装饰结构；岁月剥蚀带来的斑驳肌理是其重要质感。
    适用于丝路文化、东方传统、文旅文创、宗教美学。
