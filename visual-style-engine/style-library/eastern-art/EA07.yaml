# EA07 — Dunhuang Mineral Color / 敦煌矿物色
id: EA07
version: 1.0.0
status: ACTIVE
name: {zh: 敦煌矿物色, en: Dunhuang Mineral Color}
category: {id: eastern-art, name_zh: 东方艺术, name_en: Eastern Art}
