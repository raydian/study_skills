# IL01 — Flat Illustration / 扁平插画
id: IL01
version: 1.0.0
status: ACTIVE
name: {zh: 扁平插画, en: Flat Illustration}
category: {id: illustration, name_zh: 插画, name_en: Illustration}
parent_style: null
aliases: [flat illustration, 扁平风插画]
definition:
  summary: >-
    以纯色块与图形化语言组织的插画风格：无渐变阴影、边缘干净、叙事图形化，现代感强。
  detailed: >-
    扁平插画取消立体感表现，用色块面积、形状与位置关系传达内容；可带叙事细节与场景，但全部
    以扁平图形呈现。色彩通常明快、成体系。适用于 UI 场景、营销插画、儿童与知识图解。
visual_intent: [clean, graphic, modern]
