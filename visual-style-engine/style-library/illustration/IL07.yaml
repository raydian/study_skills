# IL07 — Grain Illustration / 颗粒插画
id: IL07
version: 1.0.0
status: ACTIVE
name: {zh: 颗粒插画, en: Grain Illustration}
category: {id: illustration, name_zh: 插画, name_en: Illustration}
parent_style: null
aliases: [grain illustration, grain texture art, 噪点插画, 杂志颗粒感]
definition:
  summary: >-
    在色块插画上叠加颗粒噪点纹理的风格：既有扁平色彩关系，又有杂志印刷的质感与温度。
  detailed: >-
    颗粒插画 = 扁平色块 + 颗粒（grain）纹理：色块建立结构，颗粒提供介质温度，两者结合产生
    杂志、海报、独立出版的"印刷感"。颗粒强度通常中等，不过度掩盖图形。适用于杂志风格内容、
    独立出版、生活方式、音乐/艺术类视觉。
