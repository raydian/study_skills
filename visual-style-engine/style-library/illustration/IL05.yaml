# IL05 — Metaphorical Illustration / 隐喻插画
id: IL05
version: 1.0.0
status: ACTIVE
name: {zh: 隐喻插画, en: Metaphorical Illustration}
category: {id: illustration, name_zh: 插画, name_en: Illustration}
parent_style: null
aliases: [metaphor illustration, 比喻插画, 象征隐喻]
definition:
  summary: >-
    把抽象关系、观点或感受具象为可读画面的插画风格：以喻体传达本体，视觉有"言外之意"。
  detailed: >-
    隐喻插画用"看得见的比喻"表达"看不见的道理"：比如用棋盘表现博弈、用锚与船表现羁绊。
    画面需在"理解门槛"与"表达张力"间平衡——喻体选择准确、视觉干净、不直白说教。适用于
    心理学、商业观点、哲学、社科类内容。
visual_intent: [metaphorical, insightful, intellectual]
