definition:
  summary: >-
    以极少元素、大量留白与强符号表达内容的插画风格：少即是多，画面剩"必要"。
  detailed: >-
    极简插画删除一切非必要元素：单一主体、大留白、克制配色、强 silhouette。它靠"选择"
    而非"填充"建立画面，符号感强。适用于封面、品牌、现代编辑、抽象概念。
