definition:
  summary: >-
    手工立体微缩场景风格：桌面剧场感、材质混搭、微缩比例、温暖手工质感。
  detailed: >-
    Diorama 是"立体模型剧场"：微缩比例的场景（建筑、自然、人物小模型），材质手工感强
    （纸、木、黏土、织物混搭），常有柔和棚内光与微缩景深。比 TD06 黏土更"场景化"，
    比 TD11 微缩更"戏剧性"。适用于创意内容、品牌场景、童话科普、手工美学。
