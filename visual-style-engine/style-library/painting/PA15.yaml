# PA15 — Digital Painting / 数字绘画
id: PA15
version: 1.0.0
status: ACTIVE
name: {zh: 数字绘画, en: Digital Painting}
category: {id: painting, name_zh: 绘画, name_en: Painting}
parent_style: PAINTING_BASE
aliases: [digital painting, 数字板绘, CG 绘画]
definition:
  summary: >-
    以数字工具模拟绘画质感：笔刷层次、光影氛围、可写实可风格化，数字创作的绘画语言。
  detailed: >-
    数字绘画是 CG 时代的主流绘画形式：用数字笔刷模拟油画/水彩/厚涂等质感，保留绘画性笔触
    同时有数字的精细可控。风格跨度大（写实厚涂到概念速涂），核心是"绘画质感而非渲染质感"。
    适用于概念设计、游戏美术、插画封面、电影美术。
