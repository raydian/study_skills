definition:
  summary: >-
    不透明水粉媒介绘画风格：色块扁平可覆盖、哑光质感、色彩饱满，兼具水彩的清透与丙烯的覆盖力。
  detailed: >-
    水粉是不透明水媒颜料：可覆盖修改、干后哑光、色块均匀饱满。它不像水彩依赖留白，而是用
    不透明色层塑造，边缘可利落可柔和。适用于插画、书籍封面、儿童绘本、复古平面感内容。
