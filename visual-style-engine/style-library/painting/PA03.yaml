# PA03 — Impressionism / 印象派
id: PA03
version: 1.0.0
status: ACTIVE
name: {zh: 印象派, en: Impressionism}
category: {id: painting, name_zh: 绘画, name_en: Painting}
parent_style: PAINTING_BASE
aliases: [impressionist painting, 印象派油画, 印象主义]
definition:
  summary: >-
    以光影与色彩笔触分离为语言的绘画风格：捕捉瞬间氛围，用分离笔触与补色表现光感。
  detailed: >-
    印象派追求"对光与氛围的即时印象"：笔触短促分离，色彩并置产生光感（补色相邻），阴影用
    色彩而非黑色，题材多为日常与风景。画面松快、空气感强。适用于自然风景、生活氛围、
    文艺气质内容。
visual_intent: [atmospheric, light-filled, poetic]
fingerprint:
  shape: [形从光色中浮现, 松散形]
  line: [笔触而非线]
  color: [明亮色彩, 补色并置]
  shading: [色彩阴影, 无黑]
  lighting: [户外光, 光感斑驳]
  texture: [可见笔触, 画布肌理]
  composition: [生活化取景, 开放式构图]
  detail: [4/10 笔触细节]
