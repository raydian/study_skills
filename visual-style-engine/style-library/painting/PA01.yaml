definition:
  summary: >-
    古典大师油画语言：罩染光影、典雅色调、严谨构图与人物描绘，历史与宗教感厚重。
  detailed: >-
    古典油画继承文艺复兴至 19 世纪学院传统：多层罩染产生深邃光影，色调典雅（赭、金、深褐、
    暗绿），构图遵循古典法则，人物描绘严谨。适用于历史、经典文学、宗教文化、古典美学内容。
