# PH01 — Natural Photography / 自然摄影
id: PH01
version: 1.0.0
status: ACTIVE
name: {zh: 自然摄影, en: Natural Photography}
category: {id: photography, name_zh: 摄影, name_en: Photography}
parent_style: null
aliases: [natural light photography, 自然光摄影]
definition:
  summary: >-
    以自然光线与真实场景为主的摄影风格，无摆拍感、无过度调色，强调真实记录与光线本身的质感。
  detailed: >-
    自然摄影依赖日光/环境光，画面保留真实场景的氛围与空气感；构图自然不刻意，色彩处理克制，
    保留胶片或传感器的真实质感。适用于纪实、旅行、自然科普、生活类内容。
