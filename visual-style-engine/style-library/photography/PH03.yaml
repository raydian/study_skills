# PH03 — Portrait Photography / 肖像摄影
id: PH03
version: 1.0.0
status: ACTIVE
name: {zh: 肖像摄影, en: Portrait Photography}
category: {id: photography, name_zh: 摄影, name_en: Photography}
parent_style: null
aliases: [portrait photo, 人物肖像]
definition:
  summary: >-
    以人物为主体的摄影风格，通过光线塑造、表情神态与简洁背景突出人物个性与情绪。
  detailed: >-
    肖像摄影关注人物本身：面部光线塑造（伦勃朗光/蝴蝶光/侧光等）、神态捕捉、简洁或有叙事性的
    背景。画幅多为人像构图，景深常控制以突出主体。适用于人物专栏、传记内容、封面人物。
