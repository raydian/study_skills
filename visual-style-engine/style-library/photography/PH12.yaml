# PH12 — Documentary Photography / 纪实摄影
id: PH12
version: 1.0.0
status: ACTIVE
name: {zh: 纪实摄影, en: Documentary Photography}
category: {id: photography, name_zh: 摄影, name_en: Photography}
parent_style: null
aliases: [documentary photo, 纪实影像]
definition:
  summary: >-
    以客观记录真实事件与人物状态为目标的摄影风格：不摆拍、不干预、克制调色，信息与情感并重。
  detailed: >-
    纪实摄影追求"真相在场感"：抓拍决定性瞬间，不干预被摄对象，构图服从内容，影调克制。
    它记录人物、社会、历史现场，常用于新闻、历史、人文类内容。区别于艺术摄影的唯美与
    电影剧照的戏剧化。
visual_intent: [truthful, human, historical]
fingerprint:
  shape: [真实人物与场景, 决定性瞬间]
  line: [无描边, 自然边缘]
  color: [纪实克制, 低干预]
  shading: [环境光, 真实光比]
  lighting: [现场光, 不补光]
  texture: [真实颗粒, 现场质感]
  composition: [内容优先, 瞬间捕捉]
  detail: [6/10 真实细节]
style_dna: {realism: 9, abstraction: 0, detail_density: 6, spatial_depth: 7, texture_strength: 6, shading_strength: 6, lighting_complexity: 6, line_presence: 0, line_roughness: 1, shape_complexity: 6, color_complexity: 4}
shape_language: {description: 真实场景人物, preferred: [现场真实形态], avoid: [摆拍造型]}
line_language: {description: 无描边, preferred: [自然边缘], avoid: [描边]}
color_system: {strategy: 纪实克制, recommended_palette_types: [PAL_NATURAL, PAL_MUTED, PAL_VINTAGE_FADED], saturation_range: [2, 5], contrast_range: [4, 7], recommended_color_count: [5, 9], avoid: [高饱和滤镜]}
shading: {method: [现场光], strength: 6, avoid: [影棚光]}
