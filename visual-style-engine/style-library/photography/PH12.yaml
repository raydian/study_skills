rules:
  must: [真实记录, 不摆拍, 不干预, 现场光]
  should: [捕捉瞬间, 构图服从内容, 克制调色]
  may: [黑白纪实, 轻微颗粒]
  must_not: [摆拍造型, 影棚补光, 高饱和滤镜, 卡通化, 3D 渲染观感, 戏剧化布光, 过度后期]
