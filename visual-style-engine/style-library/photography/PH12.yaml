material: {rendering_policy: 真实材质, preferred: [真实], avoid: [失真]}
composition: {preferred: [决定性瞬间, 内容优先, 真实取景], negative_space_range: "15-35%", layer_count: "2-3", avoid: [唯美摆拍构图]}
spatial_system: {depth: 7, perspective: [真实透视], avoid: [炫技]}
