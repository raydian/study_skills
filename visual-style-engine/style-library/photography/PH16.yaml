parent_style: null
aliases: [film photography, 胶片摄影, 胶片感]
definition:
  summary: >-
    模拟胶片相机拍摄质感的摄影风格：胶片颗粒、自然色偏、柔和宽容度、光晕与暗角，复古温度感。
  detailed: >-
    胶片摄影的核心是介质质感：银盐颗粒、轻微色偏（冷暖偏移）、高光柔化与暗部宽容、偶尔的
    漏光/光晕/暗角，以及非"数码干净"的色彩渲染。适用于复古、怀旧、文艺、旅行与生活记录。
