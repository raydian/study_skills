# GD01 — Swiss Design / 瑞士设计
id: GD01
version: 1.0.0
status: ACTIVE
name: {zh: 瑞士设计, en: Swiss Design}
category: {id: graphic-design, name_zh: 平面设计, name_en: Graphic Design}
parent_style: null
aliases: [swiss style, international style, 瑞士风格, 网格设计]
definition:
  summary: >-
    以网格系统与无衬线字体为核心的现代主义设计风格：客观、秩序、留白、几何构成。
  detailed: >-
    瑞士设计（国际主义风格）以严谨网格为骨架：无衬线字体（Helvetica 气质）、客观理性构图、
    大量留白、几何元素与摄影的克制编排。风格中性、清晰、可信。适用于品牌视觉、报告、界面、
    现代编辑。
