definition:
  summary: >-
    孔版印刷（RISO）风格：荧光撞色、错位套印、颗粒纹理、明快复古的独立出版气质。
  detailed: >-
    Risograph 是小型孔版印刷机：每色一版、套印错位、墨色荧光/高饱和（荧光粉、荧光橙、
    天蓝等）、颗粒纸感与网孔纹理。气质明快复古、独立出版/杂志/艺术场景感强。适用于
    独立出版物、艺术海报、复古排版、青年文化。
