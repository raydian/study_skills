category: {id: print, name_zh: 印刷艺术, name_en: Print Art}
parent_style: PRINT_BASE
aliases: [etching print, 蚀刻, 铜版蚀刻]
definition:
  summary: >-
    以酸蚀线条为语言的铜版画风格：细密规则线条、松动画意、复古文献气质。
  detailed: >-
    蚀刻版画用酸蚀刻出凹线，印刷后线条细密而有金属版的"呼吸感"：线密度高、方向有规则、
    边缘带版压的柔和晕染。黑白为主，偶见纸色。适用于古典文献、历史插图、文学封面、复古美学。
