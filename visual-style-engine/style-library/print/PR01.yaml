# PR01 — Woodcut / 木刻
id: PR01
version: 1.0.0
status: ACTIVE
name: {zh: 木刻, en: Woodcut}
category: {id: print, name_zh: 印刷艺术, name_en: Print Art}
parent_style: PRINT_BASE
aliases: [woodcut print, 木刻版画, 黑白木刻]
definition:
  summary: >-
    以木版刀具刻痕为语言的版画风格：黑白强烈、刀痕分明、粗犷有力的印刷质感。
  detailed: >-
    木刻以刀在木版上刻出图形，印刷后保留刀痕的边缘与黑白对比：线条由刻刀产生，粗细由刀法决定，
    常有留白与墨块的强烈节奏。黑白为主，可套色。适用于革命文艺、复古印刷、民俗、海报。
