# DR04 — Ink Line Drawing / 墨线画
id: DR04
version: 1.0.0
status: ACTIVE
name: {zh: 墨线画, en: Ink Line Drawing}
category: {id: drawing, name_zh: 素描线绘, name_en: Drawing}
parent_style: null
aliases: [ink line art, 墨线稿, 钢笔线稿]
definition:
  summary: >-
    以清晰有力的墨线表达形体的风格：线条承载结构与走势，可配少量墨色，干净利落。
  detailed: >-
    墨线画以线条为主要语言：轮廓清晰、走势果断，线宽可有变化但整体干净利落；可辅以少量
    墨色块面或水染。常用于插画线稿、版画感、印刷感、装饰画。
visual_intent: [linear, crisp, graphic]
