  line: [果断墨线, 走势有力]
  color: [墨黑为主, 可辅色]
  shading: [线排/点排, 少量墨块]
  lighting: [无真实光, 线密疏表现]
  texture: [纸面, 墨色均匀]
  composition: [线构图, 装饰平衡]
  detail: [4/10 线条细节]
