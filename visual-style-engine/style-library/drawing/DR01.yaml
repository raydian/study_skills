definition:
  summary: >-
    以石墨铅笔灰度层次造型的素描风格：纸面颗粒、排线过渡、柔和层次，朴素而专注形与光。
  detailed: >-
    铅笔素描以石墨的深浅灰度塑造体积与空间：排线/涂抹/擦揉产生层次，纸面颗粒可见。
    它强调造型与光感的结构性，常用于素描基础、手绘感插画、文献手稿风。
