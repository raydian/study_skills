# DR08 — Minimal Line Art / 极简线画
id: DR08
version: 1.0.0
status: ACTIVE
name: {zh: 极简线画, en: Minimal Line Art}
category: {id: drawing, name_zh: 素描线绘, name_en: Drawing}
parent_style: null
aliases: [minimal line art, one line feel, 极简线条]
definition:
  summary: >-
    用最少的线表达形状与表情的极简线条风格：线条干净克制，留白极大，符号感强。
  detailed: >-
    极简线画以"少"为美学：一根或几根流畅线勾勒轮廓，几乎无阴影、无细节、无填充，
    靠线条的曲直与节奏传达形状与情绪。常用于现代品牌、封面、极简装饰、社交视觉。
