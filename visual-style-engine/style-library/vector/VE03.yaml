definition:
  summary: >-
    矢量语言 + 编辑排版逻辑：图文节奏、版面结构、克制备色，杂志/出版气质。
  detailed: >-
    VE03 在矢量干净的基础上引入编辑设计思维：版面有明确的网格/节奏/图文关系，配色讲究、
    构图有出版气质。常用于杂志版面、文章配图、出版视觉。
