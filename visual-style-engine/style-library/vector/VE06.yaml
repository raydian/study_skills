definition:
  summary: >-
    糖果色 + 圆润可爱造型的矢量风格：明快甜美、轻盈俏皮，低龄友好。
  detailed: >-
    VE06 使用高亮度糖果色系（粉、柠檬黄、薄荷、天蓝、淡紫），造型圆润饱满、线条平滑，
    常带小装饰（星星、波点、糖果）。氛围甜美活泼。适用于儿童内容、甜品饮品品牌、社交贴纸、
    轻松消费品牌。
