definition:
  summary: >-
    以自由曲面与生物形态为主的矢量风格：圆润流动、柔和自然，区别于几何矢量。
  detailed: >-
    VE05 用曲线与自由曲面构成有机形态：植物、流体、身体、抽象生物形状，边缘平滑、形体饱满。
    配色可温和可明快。适用于自然主题、健康生活、有机品牌、柔和知识内容。
