aliases: [film still, movie frame, 电影感画面]
definition:
  summary: >-
    以电影帧为标准的画面风格：构图、布光、调色均按电影语言执行，叙事感与氛围感强。
  detailed: >-
    CI01 呈现"电影的一帧"：讲究的构图（三分法、纵深、前景遮挡）、电影布光（动机光、光比、
    轮廓光）、电影调色（统一色阶、情绪色调）与场景氛围。人物与环境共同叙事。适用于视频封面、
    故事性内容、氛围化配图。
