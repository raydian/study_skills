# CI04 — Film Noir / 黑色电影
id: CI04
version: 1.0.0
status: ACTIVE
name: {zh: 黑色电影, en: Film Noir}
category: {id: cinematic, name_zh: 电影感, name_en: Cinematic}
parent_style: null
aliases: [noir, 黑色电影感]
definition:
  summary: >-
    高反差黑白或低饱和、硬光投影、阴影叙事、压抑氛围的经典电影风格，善恶模糊的黑色气质。
  detailed: >-
    黑色电影的核心是光与影的叙事：高反差布光、百叶窗投影、烟与雾、低角度与荷兰角、暗部吞没
    面部。黑白为主或极低饱和，情绪压抑悬疑。适用于悬疑、罪案、黑色幽默、怀旧 noir 题材。
visual_intent: [noir, dark, suspenseful]
fingerprint:
  shape: [阴影剪影, 硬朗轮廓]
  line: [无描边, 光影硬边]
  color: [黑白或极低饱和, 高反差]
  shading: [硬光投影, 深黑阴影]
  lighting: [硬光, 低照度, 百叶窗光]
  texture: [胶片颗粒, 烟雾质感]
  composition: [荷兰角, 低角度, 剪影构图]
  detail: [6/10 阴影细节]
