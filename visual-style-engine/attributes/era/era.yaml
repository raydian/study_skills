    compatible: [EA13, EA14, EA01]

  - id: ERA_SOVIET
    name: {zh: 苏联, en: Soviet Era}
    period: 1917–1991
    prompt_anchor: [soviet era, constructivist propaganda]
    compatible: [RT14, GD04, PR01]

  - id: ERA_FUTURE
    name: {zh: 未来, en: Future}
    period: 2100+
    prompt_anchor: [futuristic era, advanced technology setting]
    compatible: [CI07, GA04, TD15, FA12]
