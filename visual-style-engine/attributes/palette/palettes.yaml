# Palette Library — 首批 25 个标准色板
# 用法：作为 Attribute 挂载到 Style（palette: PAL_XXX），不独立成 Style
schema: attribute_library
type: palette
version: "1.0.0"

palettes:
  - id: PAL_NATURAL
    name: {zh: 自然色, en: Natural}
    saturation: 4
    brightness: 6
    contrast: 5
    color_tendency: [草绿, 土褐, 天空蓝, 米白, 石灰]
    rules: {must: [真实自然和谐], avoid: [荧光, 霓虹]}
    prompt_anchor: [natural color palette, true-to-life muted greens and earth tones]
    compatible: [PH01, PH12, PH14, EA01, IL04]

  - id: PAL_PASTEL
    name: {zh: 柔和粉彩, en: Pastel}
    saturation: 3
    brightness: 8
    contrast: 3
    color_tendency: [淡粉, 浅蓝, 薄荷, 淡紫, 奶油白]
    rules: {must: [柔和轻盈], avoid: [暗沉, 浓艳]}
    prompt_anchor: [soft pastel color palette, gentle light colors]
    compatible: [TD06, TD05, AN08, VE06, IL12]

  - id: PAL_CANDY_BRIGHT
    name: {zh: 明亮糖果色, en: Candy Bright}
    saturation: 7
    brightness: 8
    contrast: 5
    color_tendency: [珊瑚粉, 柠檬黄, 薄荷绿, 天蓝, 淡紫]
    rules: {must: [干净明快], avoid: [泥棕, 脏灰, 过量黑]}
    prompt_anchor: [bright candy color palette, clean playful colors]
    compatible: [VE06, AN04, TD04, IL01]

  - id: PAL_MORANDI
