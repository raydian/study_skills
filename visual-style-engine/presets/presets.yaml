# Presets — Style + Attribute 稳定组合
# 用法：用户指定 preset_id 即可直接获得完整视觉规格；底层仍保持 Style 与 Attribute 分离
schema: preset_library
version: "1.0.0"

presets:
  - id: PRESET_MINIMAL_CANDY
    version: 1.0.0
    name: {zh: 极简矢量 · 糖果清新, en: Minimal Vector Candy}
    base_style: {id: VE01, version: 1.0.0}
    attributes: {palette: PAL_CANDY_BRIGHT, lighting: LIGHT_FLAT_GRAPHIC, composition: CMP_NEGATIVE_SPACE, mood: [playful, youthful]}
    use_cases: [儿童知识, 轻松科普, 社交贴纸]
    avoid_use_cases: [严肃学术]
    compatibility: {portrait: 7, landscape: 9, product: 8, poster: 9, education: 8, book_video: 8}

